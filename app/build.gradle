plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.verstak.harness'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.verstak.harness'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
