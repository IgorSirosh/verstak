name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Сборка
        run: gradle assembleDebug --no-daemon
      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk Verstak.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Verstak-apk
          path: Verstak.apk
      - name: Выложить в Releases (прямая ссылка на APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Verstak.apk --title "Верстак, сборка ${{ github.run_number }}" --notes "Скачай Verstak.apk и установи на телефон." --latest
